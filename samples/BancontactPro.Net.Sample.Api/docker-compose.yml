# The sample API for any Docker host. From the repository root:
#   docker compose -f samples/BancontactPro.Net.Sample.Api/docker-compose.yml up -d
# or as a stack in a container manager (Portainer, Dockge, ...). The .env.example next to this file lists the variables,
# and the sample's README maps each credential from Bancontact's onboarding email to its variable.
#
# The image is prebuilt by GitHub Actions (.github/workflows/sample-api-image.yml) and pulled from
# GitHub Container Registry, so the host never builds (some container managers, Portainer among them,
# can't run BuildKit builds). Point SAMPLE_API_IMAGE at another tag (e.g. :sha-abc1234, or a local build) to override.
services:
  sample-api:
    image: ${SAMPLE_API_IMAGE:-ghcr.io/dewall88/bancontactpro-sample-api:latest}
    restart: unless-stopped
    ports:
      # Your reverse proxy or tunnel forwards the public HTTPS hostname to this host port.
      - "${SAMPLE_API_PORT:-8085}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The public HTTPS address Bancontact reaches the app at, no trailing slash.
      PublicBaseUrl: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL to the public HTTPS address, e.g. https://bancontact-preprod.example.com}
      # Shared key for the /payments endpoints (X-Sample-Key header). Without it they refuse everything.
      SampleApiKey: ${SAMPLE_API_KEY:?set SAMPLE_API_KEY to a long random string}
      BancontactPro__Environment: ${BANCONTACT_ENVIRONMENT:-Preprod}

      # One API key + PPID pair per product, both from that product's entry in Bancontact's email.
      # Fill in the products you have; leave the others empty. At least one pair is required, and a
      # product with only one of its two values set stops the app at startup.
      BancontactPro__Products__StaticQr__ApiKey: ${BANCONTACT_STATICQR_API_KEY:-}
      BancontactPro__Products__StaticQr__MerchantProfileId: ${BANCONTACT_STATICQR_PPID:-}
      BancontactPro__Products__OnDisplay__ApiKey: ${BANCONTACT_ONDISPLAY_API_KEY:-}
      BancontactPro__Products__OnDisplay__MerchantProfileId: ${BANCONTACT_ONDISPLAY_PPID:-}
      BancontactPro__Products__OnReceipt__ApiKey: ${BANCONTACT_ONRECEIPT_API_KEY:-}
      BancontactPro__Products__OnReceipt__MerchantProfileId: ${BANCONTACT_ONRECEIPT_PPID:-}
      BancontactPro__Products__TopUp__ApiKey: ${BANCONTACT_TOPUP_API_KEY:-}
      BancontactPro__Products__TopUp__MerchantProfileId: ${BANCONTACT_TOPUP_PPID:-}
      BancontactPro__Products__Invoice__ApiKey: ${BANCONTACT_INVOICE_API_KEY:-}
      BancontactPro__Products__Invoice__MerchantProfileId: ${BANCONTACT_INVOICE_PPID:-}

      # Optional: your own signing key, only for the Refund and Reconciliation APIs. Leave both empty for payments.
      BancontactPro__Kid: ${BANCONTACT_KID:-}
      BancontactPro__PrivateKeyPem: ${BANCONTACT_PRIVATE_KEY_PEM:-}
